services:
  postgres:
    image: postgres:16-alpine
    container_name: algorevive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: algorevive
      POSTGRES_PASSWORD: algorevive
      POSTGRES_DB: algorevive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algorevive -d algorevive"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - algorevive-net

  redis:
    image: redis:7-alpine
    container_name: algorevive-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - algorevive-net

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: algorevive-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - algorevive-net

  sandbox-image:
    profiles: ["build"]
    build:
      context: .
      dockerfile: sandbox/Dockerfile.runner
    image: algorevive-sandbox:latest

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algorevive-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://algorevive:algorevive@postgres:5432/algorevive
      TEST_DATABASE_URL: postgresql://algorevive:algorevive@postgres:5432/algorevive_test
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: algorevive
      LOCAL_STORAGE_DIR: /tmp/algorevive-storage
      JWT_SECRET: super-secret-development-jwt-token-key-32chars
      JWT_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      MAX_UPLOAD_MB: 50
      SANDBOX_IMAGE: algorevive-sandbox:latest
      SANDBOX_TIMEOUT_S: 60
      SANDBOX_MEMORY_MB: 512
      SANDBOX_CPUS: 1.0
      LLM_PROVIDER: none
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_API_KEY: none
      LLM_MODEL: gpt-4o-mini
      SENTRY_DSN: ""
      VITE_API_URL: http://localhost:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - algorevive-net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algorevive-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -l info
    environment:
      DATABASE_URL: postgresql://algorevive:algorevive@postgres:5432/algorevive
      TEST_DATABASE_URL: postgresql://algorevive:algorevive@postgres:5432/algorevive_test
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: algorevive
      LOCAL_STORAGE_DIR: /tmp/algorevive-storage
      JWT_SECRET: super-secret-development-jwt-token-key-32chars
      JWT_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      MAX_UPLOAD_MB: 50
      SANDBOX_IMAGE: algorevive-sandbox:latest
      SANDBOX_TIMEOUT_S: 60
      SANDBOX_MEMORY_MB: 512
      SANDBOX_CPUS: 1.0
      LLM_PROVIDER: none
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_API_KEY: none
      LLM_MODEL: gpt-4o-mini
      SENTRY_DSN: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - algorevive-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: algorevive-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173 || curl -f http://localhost:5173 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - algorevive-net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  algorevive-net:
    driver: bridge
